<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Production vidéo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;font-size:14px}
.nav{display:flex;align-items:center;gap:2px;padding:0 20px;background:#fff;border-bottom:1px solid #e5e5e3;position:sticky;top:0;z-index:10}
.nav-title{font-size:15px;font-weight:600;margin-right:16px;padding:14px 0;white-space:nowrap}
.nav-tab{padding:14px 14px 12px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:#888;border-bottom:2px solid transparent}
.nav-tab:hover{color:#1a1a1a}
.nav-tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.select-banner{display:none;position:sticky;top:49px;z-index:9;background:#1a1a1a;color:#fff;padding:10px 20px;font-size:13px;font-weight:500;align-items:center;justify-content:space-between;gap:12px}
.select-banner.on{display:flex}
.banner-stop{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:#1a1a1a;border:none}
.banner-stop:hover{background:#f0f0f0}
.page{display:none;padding:20px}
.page.active{display:block}
.section-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.07em;padding:8px 0 6px;margin-top:8px}
.ideas-row-wrap{overflow-x:auto;background:#fff;border:1px solid #e5e5e3;border-radius:10px;margin-bottom:20px}
.ideas-row{display:flex;align-items:stretch;min-width:max-content}
.idea-cell{border-right:1px solid #e5e5e3;padding:10px 12px;min-width:175px;max-width:210px;display:flex;flex-direction:column;gap:6px}
.idea-cell:last-of-type{border-right:none}
.idea-ta{border:none;background:transparent;font-size:12px;color:#1a1a1a;font-family:inherit;outline:none;resize:none;min-height:38px;width:100%}
.idea-ta::placeholder{color:#bbb;font-style:italic}
.idea-link-in{width:100%;border:none;border-top:1px solid #e5e5e3;background:transparent;font-size:11px;color:#2563eb;font-family:inherit;outline:none;padding-top:6px}
.idea-link-in::placeholder{color:#bbb;font-style:italic}
.idea-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.promote-btn{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border:1px solid #e5e5e3;border-radius:6px;font-size:10px;cursor:pointer;background:#fff;color:#555}
.promote-btn:hover{border-color:#16a34a;color:#16a34a;background:#f0fdf4}
.idea-del{border:none;background:none;cursor:pointer;color:#bbb;padding:2px;font-size:16px;line-height:1}
.idea-del:hover{color:#dc2626}
.add-idea-cell{padding:10px 14px;display:flex;align-items:center;flex-shrink:0}
.add-idea-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border:1px dashed #d0d0ce;border-radius:6px;font-size:11px;cursor:pointer;background:transparent;color:#888;white-space:nowrap}
.add-idea-btn:hover{border-style:solid;color:#1a1a1a}
.table-wrap{background:#fff;border:1px solid #e5e5e3;border-radius:10px;overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:9px 12px;text-align:left;font-weight:600;font-size:11px;color:#888;white-space:nowrap;border-bottom:1px solid #e5e5e3;background:#fafaf8}
th.c{text-align:center}
td{padding:9px 12px;vertical-align:middle;border-bottom:1px solid #f0f0ee}
td.c{text-align:center}
tr:last-child td{border-bottom:none}
tr.done-row td{opacity:0.4}
tr:hover td{background:#fafaf8}
body.select-mode tr:hover td{background:#fffbeb}
.title-in{width:100%;border:none;background:transparent;font-size:13px;font-weight:500;color:#1a1a1a;font-family:inherit;outline:none}
.title-in:focus{outline:1px solid #d0d0ce;border-radius:4px;padding:1px 5px}
input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:#16a34a}
input[type=checkbox]:disabled{cursor:not-allowed;opacity:0.3}
body.select-mode input[type=checkbox].selectable{outline:2px solid #f59e0b;outline-offset:2px;cursor:pointer}
.link-in{width:100%;border:none;background:transparent;font-size:12px;color:#2563eb;font-family:inherit;outline:none}
.link-in::placeholder{color:#bbb;font-style:italic}
.link-in:focus{outline:1px solid #d0d0ce;border-radius:4px;padding:1px 5px}
.action-btn{border:1px solid #e5e5e3;border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer;background:#fff;color:#555;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.action-btn:hover{background:#f5f5f3}
.action-btn.has{border-color:#16a34a;color:#15803d;background:#f0fdf4}
.del-btn{border:none;background:none;cursor:pointer;color:#ccc;padding:3px;border-radius:4px;font-size:15px;line-height:1}
.del-btn:hover{color:#dc2626;background:#fef2f2}
.btn-new{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid #d0d0ce;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:#1a1a1a;margin-bottom:16px}
.btn-new:hover{background:#f5f5f3}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:100;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:20px;width:580px;max-width:100%}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.modal-header h3{font-size:14px;font-weight:600}
.modal-close{border:none;background:none;cursor:pointer;font-size:20px;color:#aaa;line-height:1;padding:2px}
.modal-close:hover{color:#1a1a1a}
.chrono-wrap{display:flex;align-items:center;gap:10px;background:#f5f5f3;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.chrono-display{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:#1a1a1a;min-width:80px}
.chrono-btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.chrono-start{background:#16a34a;color:#fff}.chrono-start:hover{background:#15803d}
.chrono-stop{background:#dc2626;color:#fff}.chrono-stop:hover{background:#b91c1c}
.chrono-reset{background:#e5e5e3;color:#555}.chrono-reset:hover{background:#d0d0ce}
.modal textarea{width:100%;resize:none;border:1px solid #e5e5e3;border-radius:8px;padding:12px;font-size:13px;font-family:inherit;color:#1a1a1a;background:#fff;overflow:hidden;min-height:80px}
.modal-acts{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.modal-acts button{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.btn-save{background:#16a34a;color:#fff;border:none}.btn-save:hover{background:#15803d}
.btn-cancel{background:#fff;border:1px solid #e5e5e3;color:#555}.btn-cancel:hover{background:#f5f5f3}
.links-grid{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.link-card{background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:12px;min-width:200px;cursor:pointer;text-decoration:none;color:#1a1a1a}
.link-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);border-color:#d0d0ce}
.lc-icon{font-size:24px;line-height:1}
.lc-text{display:flex;flex-direction:column;gap:2px}
.lc-name{font-size:13px;font-weight:600}
.lc-desc{font-size:11px;color:#888}
.lc-del{margin-left:auto;border:none;background:none;cursor:pointer;color:#ccc;font-size:16px;padding:2px;line-height:1}
.lc-del:hover{color:#dc2626}
.add-link-form{background:#fff;border:1px dashed #d0d0ce;border-radius:12px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.add-link-form input{border:1px solid #e5e5e3;border-radius:7px;padding:7px 10px;font-size:12px;font-family:inherit;outline:none;color:#1a1a1a}
.add-link-form input:focus{border-color:#aaa}
.add-link-form input.f-icon{width:60px;text-align:center}
.add-link-form input.f-name{width:130px}
.add-link-form input.f-url{width:200px}
.add-link-form input.f-desc{width:160px}
.add-link-form button{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;background:#1a1a1a;color:#fff;border:none}
.add-link-form button:hover{background:#333}
.cal-todo-wrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.cal-box{background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:16px;min-width:280px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-header h3{font-size:14px;font-weight:600}
.cal-nav{border:none;background:none;cursor:pointer;font-size:18px;color:#888;padding:2px 8px;border-radius:6px}
.cal-nav:hover{background:#f5f5f3;color:#1a1a1a}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day-name{text-align:center;font-size:10px;font-weight:600;color:#aaa;padding:4px 0}
.cal-day{text-align:center;padding:6px 4px;border-radius:8px;font-size:12px;cursor:pointer;color:#1a1a1a;position:relative;line-height:1.4}
.cal-day:hover{background:#f5f5f3}
.cal-day.other-month{color:#ccc;pointer-events:none}
.cal-day.today{font-weight:700;color:#16a34a}
.cal-day.selected{background:#1a1a1a;color:#fff}
.cal-day.selected.today{background:#16a34a}
.dot{width:4px;height:4px;background:#f59e0b;border-radius:50%;margin:2px auto 0;display:block}
.cal-day.selected .dot{background:#fff}
.todo-box{flex:1;min-width:260px;background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:16px}
.todo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.todo-header h3{font-size:14px;font-weight:600}
.btn-select{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#f59e0b;color:#fff;border:none}
.btn-select:hover{background:#d97706}
.todo-empty{font-size:12px;color:#bbb;font-style:italic;padding:8px 0}
.todo-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0ee}
.todo-item:last-child{border-bottom:none}
.todo-item input[type=checkbox]{width:15px;height:15px;accent-color:#16a34a;cursor:pointer;flex-shrink:0}
.todo-item-text{flex:1;font-size:13px;line-height:1.3}
.todo-item-text.done-text{text-decoration:line-through;color:#aaa}
.todo-item-vid{font-size:10px;color:#888;margin-top:1px}
.todo-del{border:none;background:none;cursor:pointer;color:#ccc;font-size:16px;padding:2px;line-height:1}
.todo-del:hover{color:#dc2626}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:8px 18px;border-radius:99px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="nav">
  <span class="nav-title">🎬 Production</span>
  <button class="nav-tab active" id="tab-prod" onclick="showTab('prod',this)">Vidéos</button>
  <button class="nav-tab" id="tab-todo" onclick="showTab('todo',this)">📅 À faire</button>
  <button class="nav-tab" id="tab-links" onclick="showTab('links',this)">🔗 Accès rapides</button>
</div>

<div class="select-banner" id="select-banner">
  <span>🟡 Mode sélection — navigue et clique sur les cases à planifier pour le <strong id="banner-date"></strong></span>
  <button class="banner-stop" onclick="stopSelectMode()">✕ Terminer</button>
</div>

<div class="page active" id="page-prod">
  <div class="section-label">💡 Idées en attente</div>
  <div class="ideas-row-wrap">
    <div class="ideas-row" id="ideas-row">
      <div class="add-idea-cell"><button class="add-idea-btn" onclick="addIdea()">+ Idée</button></div>
    </div>
  </div>
  <button class="btn-new" onclick="addVideo()">+ Nouvelle vidéo</button>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Titre</th>
          <th class="c">Tourné</th>
          <th class="c">Dérush</th>
          <th class="c">Clips</th>
          <th class="c">Sous-titres</th>
          <th class="c">Fini</th>
          <th>Lien</th>
          <th>Script</th>
          <th>Note</th>
          <th style="width:28px"></th>
        </tr>
      </thead>
      <tbody id="active-body"></tbody>
    </table>
  </div>
  <div id="done-section" style="display:none">
    <div class="section-label">✅ Terminées</div>
    <div class="table-wrap"><table><tbody id="done-body"></tbody></table></div>
  </div>
</div>

<div class="page" id="page-todo">
  <div class="cal-todo-wrap">
    <div class="cal-box">
      <div class="cal-header">
        <button class="cal-nav" onclick="calNav(-1)">‹</button>
        <h3 id="cal-title"></h3>
        <button class="cal-nav" onclick="calNav(1)">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="todo-box">
      <div class="todo-header">
        <h3 id="todo-title">Sélectionne un jour</h3>
        <button class="btn-select" id="btn-select" onclick="startSelectMode()" style="display:none">+ Sélectionner des tâches</button>
      </div>
      <div id="todo-list"></div>
    </div>
  </div>
</div>

<div class="page" id="page-links">
  <div class="section-label" style="margin-top:0">Accès rapides</div>
  <div class="links-grid" id="links-grid"></div>
  <div class="section-label">Ajouter un lien</div>
  <div class="add-link-form">
    <input class="f-icon" id="lf-icon" placeholder="🎵" maxlength="4"/>
    <input class="f-name" id="lf-name" placeholder="Nom (ex: TikTok Studio)"/>
    <input class="f-url"  id="lf-url"  placeholder="https://..."/>
    <input class="f-desc" id="lf-desc" placeholder="Description courte"/>
    <button onclick="addLink()">Ajouter</button>
  </div>
</div>

<div class="modal-overlay" id="script-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="script-modal-title">Script</h3>
      <button class="modal-close" onclick="closeScript()">×</button>
    </div>
    <div class="chrono-wrap">
      <span class="chrono-display" id="chrono-display">00:00</span>
      <button class="chrono-btn chrono-start" id="chrono-btn" onclick="toggleChrono()">▶ Start</button>
      <button class="chrono-btn chrono-reset" onclick="resetChrono()">↺ Reset</button>
    </div>
    <textarea id="script-ta" placeholder="Colle ton script ici..." oninput="autoResize(this)"></textarea>
    <div class="modal-acts">
      <button class="btn-cancel" onclick="closeScript()">Fermer</button>
      <button class="btn-save" onclick="saveScript()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="note-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="note-modal-title">Note</h3>
      <button class="modal-close" onclick="closeNote()">×</button>
    </div>
    <textarea id="note-ta" placeholder="Tes notes ici..." oninput="autoResize(this)"></textarea>
    <div class="modal-acts">
      <button class="btn-cancel" onclick="closeNote()">Fermer</button>
      <button class="btn-save" onclick="saveNote()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STEPS=[{k:'shot',l:'Tourné'},{k:'derush',l:'Dérush'},{k:'clips',l:'Clips'},{k:'subs',l:'Sous-titres'},{k:'done',l:'Fini'}];
let vids=[],ideas=[],links=[],todos={};
let nv=1,ni=1,nl=1;
let scriptId=null,noteId=null;
let selectMode=false,selectDate=null,selectedDate=null;
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth();
let chronoSecs=0,chronoRunning=false,chronoInterval=null;

function toggleChrono(){
  if(chronoRunning){
    clearInterval(chronoInterval);chronoRunning=false;
    document.getElementById('chrono-btn').className='chrono-btn chrono-start';
    document.getElementById('chrono-btn').textContent='▶ Start';
  }else{
    chronoRunning=true;
    document.getElementById('chrono-btn').className='chrono-btn chrono-stop';
    document.getElementById('chrono-btn').textContent='⏸ Stop';
    chronoInterval=setInterval(()=>{
      chronoSecs++;
      const m=String(Math.floor(chronoSecs/60)).padStart(2,'0');
      const s=String(chronoSecs%60).padStart(2,'0');
      document.getElementById('chrono-display').textContent=m+':'+s;
    },1000);
  }
}
function resetChrono(){
  clearInterval(chronoInterval);chronoRunning=false;chronoSecs=0;
  document.getElementById('chrono-display').textContent='00:00';
  document.getElementById('chrono-btn').className='chrono-btn chrono-start';
  document.getElementById('chrono-btn').textContent='▶ Start';
}

function showTab(t,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+t).classList.add('active');
  el.classList.add('active');
}

function load(){
  try{
    const sv=localStorage.getItem('prod_vids');
    const si=localStorage.getItem('prod_ideas');
    const sl=localStorage.getItem('prod_links');
    const st=localStorage.getItem('prod_todos');
    const sc=localStorage.getItem('prod_counters');
    if(sv)vids=JSON.parse(sv);
    if(si)ideas=JSON.parse(si);
    if(sl)links=JSON.parse(sl);
    if(st)todos=JSON.parse(st);
    if(sc){const c=JSON.parse(sc);nv=c.nv||1;ni=c.ni||1;nl=c.nl||1;}
    if(!vids.length&&!ideas.length){
      vids=[{id:nv++,title:'Vidéo exemple',shot:false,derush:false,clips:false,subs:false,done:false,link:'',script:'',note:''}];
      ideas=[{id:ni++,text:'',link:''}];
    }
    if(!links.length){
      links=[
        {id:nl++,icon:'🎵',name:'TikTok Studio',url:'https://studio.tiktok.com',desc:'Gérer tes vidéos TikTok'},
        {id:nl++,icon:'🤖',name:'Claude',url:'https://claude.ai',desc:'Générer tes scripts'},
      ];
    }
  }catch(e){vids=[];ideas=[];links=[];todos={};}
}

function save(){
  try{
    localStorage.setItem('prod_vids',JSON.stringify(vids));
    localStorage.setItem('prod_ideas',JSON.stringify(ideas));
    localStorage.setItem('prod_links',JSON.stringify(links));
    localStorage.setItem('prod_todos',JSON.stringify(todos));
    localStorage.setItem('prod_counters',JSON.stringify({nv,ni,nl}));
  }catch(e){}
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
function autoResize(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function stepLabel(k){const s=STEPS.find(s=>s.k===k);return s?s.l:k;}

// SELECT MODE
function startSelectMode(){
  if(!selectDate){toast('Sélectionne un jour d\'abord');return;}
  selectMode=true;
  document.body.classList.add('select-mode');
  document.getElementById('select-banner').classList.add('on');
  document.getElementById('banner-date').textContent=formatDateFr(selectDate);
  showTab('prod',document.getElementById('tab-prod'));
  render();
  toast('🟡 Clique sur les cases à planifier');
}
function stopSelectMode(){
  selectMode=false;
  document.body.classList.remove('select-mode');
  document.getElementById('select-banner').classList.remove('on');
  showTab('todo',document.getElementById('tab-todo'));
  render();renderTodo();
}

// CALENDAR
function dateKey(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function formatDateFr(key){
  const [y,m,d]=key.split('-');
  const months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  return`${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}
function calNav(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCal();
}
function renderCal(){
  const months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  document.getElementById('cal-title').textContent=months[calMonth]+' '+calYear;
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  ['L','M','M','J','V','S','D'].forEach(d=>{
    const el=document.createElement('div');el.className='cal-day-name';el.textContent=d;grid.appendChild(el);
  });
  const first=new Date(calYear,calMonth,1).getDay();
  const offset=first===0?6:first-1;
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const today=new Date();
  for(let i=0;i<offset;i++){
    const el=document.createElement('div');el.className='cal-day other-month';
    el.textContent=prevDays-offset+1+i;grid.appendChild(el);
  }
  for(let d=1;d<=daysInMonth;d++){
    const el=document.createElement('div');el.className='cal-day';
    el.textContent=d;
    const key=dateKey(calYear,calMonth,d);
    if(today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===d)el.classList.add('today');
    if(selectedDate===key)el.classList.add('selected');
    if(todos[key]&&todos[key].length>0){const dot=document.createElement('span');dot.className='dot';el.appendChild(dot);}
    el.onclick=()=>selectDay(key);
    grid.appendChild(el);
  }
}
function selectDay(key){
  selectedDate=key;selectDate=key;
  document.getElementById('btn-select').style.display='';
  document.getElementById('todo-title').textContent=formatDateFr(key);
  renderCal();renderTodo();
}

// TODO
function renderTodo(){
  const list=document.getElementById('todo-list');
  if(!selectedDate){list.innerHTML='<div class="todo-empty">Sélectionne un jour dans le calendrier.</div>';return;}
  const items=todos[selectedDate]||[];
  if(!items.length){list.innerHTML='<div class="todo-empty">Aucune tâche. Clique sur "+ Sélectionner des tâches".</div>';return;}
  list.innerHTML='';
  items.forEach((item,idx)=>{
    const v=vids.find(v=>v.id===item.vidId);
    const checked=v?v[item.step]:false;
    const div=document.createElement('div');div.className='todo-item';
    div.innerHTML=`
      <input type="checkbox" ${checked?'checked':''} onchange="toggleTodoItem('${selectedDate}',${idx},this.checked)"/>
      <div class="todo-item-text${checked?' done-text':''}">
        ${stepLabel(item.step)}
        <div class="todo-item-vid">${v?esc(v.title):'Vidéo supprimée'}</div>
      </div>
      <button class="todo-del" onclick="delTodoItem('${selectedDate}',${idx})">×</button>
    `;
    list.appendChild(div);
  });
}
function toggleTodoItem(dKey,idx,val){
  const item=todos[dKey][idx];
  const v=vids.find(v=>v.id===item.vidId);
  if(!v)return;
  if(item.step==='done'){
    if(!v.shot){toast('Tourne d\'abord !');return;}
    v.done=val;
    if(val)STEPS.forEach(s=>v[s.k]=true);
    else STEPS.forEach(s=>v[s.k]=false);
  }else{
    if(item.step!=='shot'&&!v.shot){toast('Tourne d\'abord !');return;}
    v[item.step]=val;
    if(!val){
      const i=STEPS.findIndex(s=>s.k===item.step);
      for(let j=i;j<STEPS.length;j++)v[STEPS[j].k]=false;
      v.done=false;
    }
  }
  save();render();renderTodo();renderCal();
}
function delTodoItem(dKey,idx){
  todos[dKey].splice(idx,1);
  if(!todos[dKey].length)delete todos[dKey];
  save();renderTodo();renderCal();
}
function addTodoItem(vidId,step){
  if(!selectDate)return;
  if(!todos[selectDate])todos[selectDate]=[];
  if(todos[selectDate].find(i=>i.vidId===vidId&&i.step===step)){toast('Déjà dans la liste !');return;}
  todos[selectDate].push({vidId,step});
  save();
  toast('✓ Ajouté au '+formatDateFr(selectDate));
}

// ROWS
function mkRow(v){
  const tr=document.createElement('tr');
  if(v.done)tr.classList.add('done-row');
  const stepCells=STEPS.slice(0,-1).map(s=>{
    const dis=s.k!=='shot'&&!v.shot;
    return`<td class="c"><input type="checkbox" class="${selectMode?'selectable':''}" ${v[s.k]?'checked':''} ${dis&&!selectMode?'disabled title="Tourne d\'abord !"':''} onchange="handleCb(event,${v.id},'${s.k}',this)"/></td>`;
  }).join('');
  const doneCel=`<td class="c"><input type="checkbox" class="${selectMode?'selectable':''}" ${v.done?'checked':''} ${!v.shot&&!selectMode?'disabled title="Tourne d\'abord !"':''} onchange="handleCb(event,${v.id},'done',this)"/></td>`;
  tr.innerHTML=`
    <td><input class="title-in" value="${esc(v.title)}" onchange="upTitle(${v.id},this.value)" placeholder="Titre" ${selectMode?'readonly':''}></td>
    ${stepCells}${doneCel}
    <td>${selectMode?'':'<input class="link-in" value="'+esc(v.link)+'" placeholder="Lien…" onchange="upLink('+v.id+',this.value)" ondblclick="if(this.value.startsWith(\'http\'))window.open(this.value,\'_blank\')"/>'}</td>
    <td>${selectMode?'':`<button class="action-btn${v.script?' has':''}" onclick="openScript(${v.id})">${v.script?'📄 Script':'+ Script'}</button>`}</td>
    <td>${selectMode?'':`<button class="action-btn${v.note?' has':''}" onclick="openNote(${v.id})">${v.note?'📝 Note':'+ Note'}</button>`}</td>
    <td>${selectMode?'':`<button class="del-btn" onclick="delVid(${v.id})">🗑</button>`}</td>
  `;
  return tr;
}
function handleCb(e,vidId,step,cb){
  if(selectMode){
    e.preventDefault();
    cb.checked=!cb.checked;
    addTodoItem(vidId,step);
    return;
  }
  if(step==='done')togDone(vidId,cb.checked);
  else togStep(vidId,step,cb.checked);
}
function render(){
  const ab=document.getElementById('active-body');
  const db=document.getElementById('done-body');
  const ds=document.getElementById('done-section');
  ab.innerHTML='';db.innerHTML='';
  vids.filter(v=>!v.done).forEach(v=>ab.appendChild(mkRow(v)));
  const done=vids.filter(v=>v.done);
  done.forEach(v=>db.appendChild(mkRow(v)));
  ds.style.display=done.length?'block':'none';
}
function renderIdeas(){
  const row=document.getElementById('ideas-row');
  const btn=row.querySelector('.add-idea-cell');
  row.querySelectorAll('.idea-cell').forEach(e=>e.remove());
  ideas.forEach(idea=>{
    const d=document.createElement('div');d.className='idea-cell';
    d.innerHTML=`
      <textarea class="idea-ta" placeholder="Ton idée…" onchange="upIdea(${idea.id},this.value)">${esc(idea.text)}</textarea>
      <input class="idea-link-in" value="${esc(idea.link||'')}" placeholder="🔗 Lien TikTok…" onchange="upIdeaLink(${idea.id},this.value)" ondblclick="if(this.value.startsWith('http'))window.open(this.value,'_blank')"/>
      <div class="idea-foot">
        <button class="promote-btn" onclick="promoteIdea(${idea.id})">↑ En prod</button>
        <button class="idea-del" onclick="delIdea(${idea.id})">×</button>
      </div>`;
    row.insertBefore(d,btn);
  });
}
function renderLinks(){
  const g=document.getElementById('links-grid');g.innerHTML='';
  links.forEach(l=>{
    const a=document.createElement('a');a.className='link-card';a.href=l.url;a.target='_blank';a.rel='noopener';
    a.innerHTML=`<span class="lc-icon">${esc(l.icon)}</span><span class="lc-text"><span class="lc-name">${esc(l.name)}</span><span class="lc-desc">${esc(l.desc)}</span></span><button class="lc-del" onclick="event.preventDefault();delLink(${l.id})">×</button>`;
    g.appendChild(a);
  });
}

function addVideo(){vids.push({id:nv++,title:'Nouvelle vidéo',shot:false,derush:false,clips:false,subs:false,done:false,link:'',script:'',note:''});save();render();toast('Vidéo ajoutée !');}
function delVid(id){if(!confirm('Supprimer ?'))return;vids=vids.filter(v=>v.id!==id);save();render();}
function upTitle(id,v){const x=vids.find(v=>v.id===id);if(x){x.title=v;save();}}
function upLink(id,v){const x=vids.find(v=>v.id===id);if(x){x.link=v;save();}}
function togStep(id,key,val){
  const v=vids.find(v=>v.id===id);if(!v)return;
  if(key!=='shot'&&!v.shot)return;
  v[key]=val;
  if(!val){const i=STEPS.findIndex(s=>s.k===key);for(let j=i;j<STEPS.length;j++)v[STEPS[j].k]=false;v.done=false;}
  save();render();renderTodo();
}
function togDone(id,val){
  const v=vids.find(v=>v.id===id);if(!v||!v.shot)return;
  v.done=val;
  if(val){STEPS.forEach(s=>v[s.k]=true);toast('🎉 Vidéo terminée !');}
  else STEPS.forEach(s=>v[s.k]=false);
  save();render();renderTodo();
}
function openScript(id){
  const v=vids.find(v=>v.id===id);if(!v)return;
  scriptId=id;resetChrono();
  document.getElementById('script-modal-title').textContent='Script — '+v.title;
  const ta=document.getElementById('script-ta');ta.value=v.script||'';
  document.getElementById('script-modal').classList.add('open');
  setTimeout(()=>autoResize(ta),10);
}
function closeScript(){resetChrono();document.getElementById('script-modal').classList.remove('open');scriptId=null;}
function saveScript(){
  const v=vids.find(v=>v.id===scriptId);
  if(v){v.script=document.getElementById('script-ta').value;save();}
  closeScript();render();toast('Script sauvegardé ✓');
}
function openNote(id){
  const v=vids.find(v=>v.id===id);if(!v)return;
  noteId=id;
  document.getElementById('note-modal-title').textContent='Note — '+v.title;
  const ta=document.getElementById('note-ta');ta.value=v.note||'';
  document.getElementById('note-modal').classList.add('open');
  setTimeout(()=>autoResize(ta),10);
}
function closeNote(){document.getElementById('note-modal').classList.remove('open');noteId=null;}
function saveNote(){
  const v=vids.find(v=>v.id===noteId);
  if(v){v.note=document.getElementById('note-ta').value;save();}
  closeNote();render();toast('Note sauvegardée ✓');
}
function addIdea(){ideas.push({id:ni++,text:'',link:''});save();renderIdeas();}
function delIdea(id){ideas=ideas.filter(i=>i.id!==id);save();renderIdeas();}
function upIdea(id,val){const i=ideas.find(i=>i.id===id);if(i){i.text=val;save();}}
function upIdeaLink(id,val){const i=ideas.find(i=>i.id===id);if(i){i.link=val;save();}}
function promoteIdea(id){
  const idea=ideas.find(i=>i.id===id);if(!idea)return;
  vids.push({id:nv++,title:idea.text.split('\n')[0].slice(0,50)||'Idée promue',shot:false,derush:false,clips:false,subs:false,done:false,link:idea.link||'',script:idea.text,note:''});
  ideas=ideas.filter(i=>i.id!==id);
  save();render();renderIdeas();toast('Idée promue en production !');
}
function addLink(){
  const icon=document.getElementById('lf-icon').value.trim()||'🔗';
  const name=document.getElementById('lf-name').value.trim();
  const url=document.getElementById('lf-url').value.trim();
  const desc=document.getElementById('lf-desc').value.trim();
  if(!name||!url){toast('Nom et URL requis !');return;}
  links.push({id:nl++,icon,name,url,desc});
  save();renderLinks();
  ['lf-icon','lf-name','lf-url','lf-desc'].forEach(id=>document.getElementById(id).value='');
  toast('Lien ajouté !');
}
function delLink(id){links=links.filter(l=>l.id!==id);save();renderLinks();}
document.getElementById('script-modal').addEventListener('click',function(e){if(e.target===this)closeScript();});
document.getElementById('note-modal').addEventListener('click',function(e){if(e.target===this)closeNote();});

load();render();renderIdeas();renderLinks();renderCal();
</script>
</body>
